[project]
name = "omnisvg"
description = "OmniSVG: A Unified Scalable Vector Graphics Generation Model,you can try it in ComfyUI."
version = "2.0.0"
license = {file = "LICENSE"}
# Inference runs on ComfyUI's own text-encoder core (comfy.text_encoders.llama +
# comfy.text_encoders.qwen_vl), so diffusers / accelerate / qwen-vl-utils /
# CairoSVG / pycairo / moviepy / networkx / shapely are no longer needed.
dependencies = ["transformers", "pillow-lunasvg"]

[project.urls]
Repository = "https://github.com/smthemex/ComfyUI_OmniSVG"
#  Used by Comfy Registry https://registry.comfy.org

